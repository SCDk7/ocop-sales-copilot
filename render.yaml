services:
  - type: web
    name: ocop-sales-copilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:css && npm run build:kpi
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-3.5-flash-lite
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
  - type: web
    name: ocop-sales-copilot-kpi
    runtime: node
    plan: free
    buildCommand: node kpi-site/build.cjs
    startCommand: node kpi-site/server.cjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OCOP_METRICS_URL
        value: https://ocop-sales-copilot.onrender.com/api/ai/metrics
