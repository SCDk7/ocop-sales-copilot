<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OCOP • Dashboard KPI</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#193b32;background:#f4f7f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1260px;margin:auto;padding:28px 24px calc(32px + env(safe-area-inset-bottom))}header,.actions,.brand,.toolbar,.panel-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;padding-bottom:24px;border-bottom:1px solid #dae5da}.brand strong{font-size:20px;letter-spacing:1px}.brand small{display:block;margin-top:4px}.logo{display:grid;place-items:center;background:#1b4938;color:#fff;width:46px;height:46px;border-radius:14px;font-size:28px;font-weight:700}.eyebrow{font-size:12px;color:#8a6a2a;font-weight:700;margin-top:32px;letter-spacing:1px}h1{font-size:clamp(28px,4vw,44px);letter-spacing:-1px;margin:10px 0}h2{font-size:19px;margin:0 0 8px}.intro{color:#64746b;line-height:1.6}.live{font-size:12px;color:#417453}.live:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#479567;margin-right:6px}button,select{font:inherit;color:#1b4938;border:1px solid #c9d9cc;border-radius:10px;padding:10px 14px;background:white;cursor:pointer;max-width:100%}button:hover{background:#e9f1e7}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #bd9543;outline-offset:3px}#refresh{background:#1b4938;color:white}.toolbar{margin-top:24px}.toolbar label{font-size:14px;font-weight:600}#export{margin-left:auto}.status{font-size:13px;min-height:20px;color:#64746b;line-height:1.6}.status.error{color:#a13c31;background:#fff0ea;padding:10px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.panel{background:#fff;border:1px solid #dee7dc;border-radius:18px;padding:22px;min-width:0}.card span{font-size:14px;font-weight:600}.value{font-size:clamp(27px,3vw,36px);font-weight:750;letter-spacing:-1px;margin:14px 0 10px}.card small,.quality small,.detail,.brand small{color:#66776c;line-height:1.6;font-size:12px}.card small{display:block}.card:nth-child(4){background:#eaf2e8}.charts{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin:20px 0}.panel-title{justify-content:space-between}.badge{background:#f2f5ed;border-radius:8px;padding:5px 9px;font-size:11px}.chart svg{width:100%;height:auto;display:block}.chart{min-height:200px}.chart circle:focus{outline:none;stroke:#bd9543;stroke-width:4}.chart circle:hover{r:6}.donut-layout{display:flex;align-items:center;gap:22px;margin-top:20px}.donut{width:155px;flex-shrink:0}.donut svg{width:100%;display:block}.donut circle:focus{outline:none;opacity:.6}.legend{padding:0;list-style:none;margin:0;min-width:0;flex:1}.legend li{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.5;padding:7px 0;border-bottom:1px solid #edf1e8}.legend .swatch{flex-shrink:0;width:9px;height:9px;border-radius:3px;margin-top:5px}.legend .name{flex:1;overflow-wrap:anywhere}.legend b{white-space:nowrap;font-weight:600}.empty{display:grid;place-items:center;min-height:200px;color:#7b897f;font-size:14px;text-align:center}.technical{margin-bottom:20px}.quality{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:20px}.quality strong{display:block;font-size:28px;margin:10px 0}.quality span{font-size:14px}.quality small{display:block}.definitions{font-size:14px;line-height:1.75}.definitions summary{cursor:pointer;font-weight:650}.definitions p{color:#64746b}footer{text-align:center;color:#7b897f;font-size:12px;margin-top:26px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.charts{grid-template-columns:1fr}}@media(max-width:550px){main{padding:18px 12px calc(24px + env(safe-area-inset-bottom))}.actions{gap:8px}.live{width:100%}.grid{gap:10px}.card{padding:15px}.card span{font-size:12px}.value{font-size:27px}.panel{padding:18px}.quality{grid-template-columns:1fr;gap:20px}.quality>div+div{border-top:1px solid #edf1e8;padding-top:16px}.donut-layout{flex-direction:column;align-items:stretch}.donut{align-self:center}.toolbar label{width:100%}#period{flex:1;min-width:0}#export{margin:0}.chart{min-height:140px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
.quality strong{overflow-wrap:anywhere;font-size:clamp(22px,2.5vw,28px)}
</style></head>
<body><main>
<header><div class="brand"><span class="logo" aria-hidden="true">O</span><div><strong>OCOP KPI</strong><small data-vi="Hiệu quả từ dữ liệu thực" data-en="Performance from real data"></small></div></div><div class="actions"><span class="live" data-vi="Cập nhật mỗi 10 giây" data-en="Updates every 10 seconds"></span><button id="lang" type="button" title="Chuyển sang tiếng Anh">Tiếng Việt</button><button id="refresh" data-vi="Làm mới" data-en="Refresh"></button></div></header>
<p class="eyebrow">OCOP SALES COPILOT / AI DIGITAL BUSINESS CHALLENGE 2026</p>
<h1 data-vi="Bảng điều khiển hiệu suất" data-en="Performance dashboard"></h1>
<p class="intro" data-vi="Theo dõi chất lượng tư vấn, hoạt động AI và hiệu quả tạo đơn nháp trong cùng một góc nhìn." data-en="Track consultation quality, AI operations and draft order performance in one view."></p>
<div class="toolbar"><label for="period" data-vi="Khoảng thời gian" data-en="Time range"></label><select id="period"><option value="day" data-vi="Hôm nay" data-en="Today"></option><option value="week" data-vi="7 ngày gần nhất" data-en="Last 7 days"></option><option value="month" data-vi="30 ngày gần nhất" data-en="Last 30 days"></option><option value="all" data-vi="Lịch sử lưu giữ (tối đa 90 ngày)" data-en="Retained history (up to 90 days)"></option></select><button id="export" disabled data-vi="Xuất CSV" data-en="Export CSV"></button></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section class="grid" aria-label="KPIs">
<article class="card"><span data-vi="Tin nhắn đã xử lý" data-en="Processed messages"></span><div class="value" id="requests">—</div><small id="requestDetail"></small></article>
<article class="card"><span data-vi="Phiên tư vấn" data-en="Consultation sessions"></span><div class="value" id="sessions">—</div><small data-vi="Phiên ẩn danh có ít nhất một lượt chat" data-en="Anonymous sessions with at least one chat"></small></article>
<article class="card"><span data-vi="Đơn nháp đã tạo" data-en="Created draft orders"></span><div class="value" id="drafts">—</div><small id="draftDetail"></small></article>
<article class="card"><span data-vi="Phản hồi trung bình" data-en="Average response time"></span><div class="value" id="latency">—</div><small id="latencyDetail"></small></article>
<article class="card"><span data-vi="Chuyển đổi đơn nháp" data-en="Draft conversion"></span><div class="value" id="conversion">—</div><small id="conversionDetail"></small></article>
<article class="card"><span data-vi="Phiên yêu cầu nhân viên" data-en="Sessions requesting staff"></span><div class="value" id="handoff">—</div><small id="handoffDetail"></small></article>
<article class="card"><span data-vi="Tự phục vụ (ước tính)" data-en="Self-service (estimate)"></span><div class="value" id="automation">—</div><small data-vi="Phiên không lỗi và không yêu cầu nhân viên / tổng phiên" data-en="Sessions without errors or staff requests / all sessions"></small></article>
<article class="card"><span data-vi="Gọi công cụ thành công" data-en="Successful tool calls"></span><div class="value" id="tools">—</div><small id="toolDetail"></small></article>
</section>
<section class="panel technical"><h2 data-vi="Kết quả kinh doanh đã xác nhận" data-en="Confirmed business outcomes"></h2><p class="detail" data-vi="Theo thời điểm người bán ghi nhận từng trạng thái trong khoảng đã chọn. Thanh toán là xác nhận của người bán, chưa tích hợp đối soát ngân hàng tự động." data-en="Based on when the seller records each status within the selected period. Payment is seller-confirmed; automatic bank reconciliation is not connected."></p><div class="quality"><div><span data-vi="Doanh thu đã thu" data-en="Received revenue"></span><strong id="paidRevenue">—</strong><small id="paidDetail"></small></div><div><span data-vi="Doanh thu gắn phiên chatbot" data-en="Chatbot-linked revenue"></span><strong id="chatbotRevenue">—</strong><small data-vi="Đơn có mã phiên tư vấn và được xác nhận đã thu tiền; gồm phí giao hàng" data-en="Paid orders linked to a consultation session; includes shipping"></small></div><div><span data-vi="Đơn xác nhận / hoàn tất" data-en="Confirmed / completed orders"></span><strong id="businessOrders">—</strong><small data-vi="Hoàn tất giao hàng chưa đồng nghĩa đã thu tiền" data-en="Completed delivery does not imply payment received"></small></div></div></section>
<section class="charts">
<article class="panel"><div class="panel-title"><h2 data-vi="Nhịp tư vấn theo giờ" data-en="Consultations by hour"></h2><span class="badge">UTC+7</span></div><p class="detail" data-vi="Số lượt chat theo 24 khung giờ, cộng gộp các ngày trong khoảng đã chọn. Chạm hoặc rê chuột vào điểm để xem số lượt." data-en="Chat requests across 24 hourly slots, summed over the selected days. Tap or hover over a point for the count."></p><div id="hourChart" class="chart"></div><p id="hourSummary" class="detail"></p></article>
<article class="panel"><h2 data-vi="Sản phẩm được tư vấn / tra cứu" data-en="Recommended / retrieved products"></h2><p class="detail" data-vi="Đếm mỗi sản phẩm một lần trong mỗi câu trả lời hoặc kết quả công cụ thành công; không phải doanh số hay nhu cầu được khách xác nhận." data-en="Each product counts once per successful answer or tool result; this is not sales or confirmed customer demand."></p><div class="donut-layout"><div id="productChart" class="donut"></div><ul id="productLegend" class="legend"></ul></div></article>
</section>
<section class="panel technical"><div><h2 data-vi="Chất lượng AI & nguồn dữ liệu" data-en="AI quality & data sources"></h2><p class="detail" data-vi="Phân biệt chỉ số đã đo với mục tiêu cần kiểm chứng." data-en="Separate measured outcomes from targets that need validation."></p></div><div class="quality"><div><span data-vi="Độ chính xác RAG" data-en="RAG accuracy"></span><strong id="accuracy">—</strong><small data-vi="Mục tiêu >95%. Chưa có bộ kiểm thử được gán nhãn đối chiếu hồ sơ gốc; chưa thể công bố tỷ lệ." data-en="Target >95%. No labelled evaluation against source records exists yet; accuracy cannot be reported."></small></div><div><span data-vi="Phản hồi có Gemini" data-en="Responses with Gemini"></span><strong id="gemini">—</strong><small data-vi="Đếm phản hồi có ghi nhận tích hợp Gemini" data-en="Responses reporting Gemini participation"></small></div><div><span data-vi="Phản hồi có Wikipedia" data-en="Responses with Wikipedia"></span><strong id="wiki">—</strong><small data-vi="Ngữ cảnh văn hóa tham khảo, không xác nhận thông tin riêng của sản phẩm" data-en="Cultural context; does not verify product-specific claims"></small></div></div></section>
<details class="panel definitions"><summary data-vi="Cách đo và giới hạn số liệu" data-en="Measurement definitions and limits"></summary><p data-vi="Chuyển đổi = số phiên tư vấn có ít nhất một đơn nháp mới trong khoảng đã chọn / tổng phiên tư vấn cùng khoảng. Đơn nháp chưa phải đơn đã thanh toán. Gửi lại cùng một đơn không tăng bộ đếm." data-en="Conversion = consultation sessions with at least one new draft in the selected period / consultation sessions in that period. Drafts are not paid orders. Retrying the same draft does not increase the count."></p><p data-vi="Yêu cầu nhân viên thể hiện bot gắn cờ cần hỗ trợ; chưa xác nhận nhân viên đã tiếp nhận. Tự phục vụ là chỉ số ước tính, không chứng minh vấn đề đã được giải quyết hay bán hàng thành công." data-en="Staff requests indicate that the bot flags a need for assistance, not confirmed staff receipt. Self-service is a proxy, not proof of issue resolution or successful sales."></p><p data-vi="Thời gian đo từ lúc backend nhận yêu cầu đến lúc trả JSON, gồm cả yêu cầu lỗi; không gồm mạng và hiển thị trình duyệt. Công cụ thành công nghĩa là không trả lỗi thực thi, không đánh giá độ đúng nội dung hay xác nhận còn hàng." data-en="Latency measures backend time to JSON, including failures; excludes network and browser rendering. Tool success means execution without an error, not content accuracy or confirmed stock availability."></p><p data-vi="Lịch sử được lưu tối đa 90 ngày / 50.000 sự kiện, cần ổ đĩa lưu trữ bền vững khi triển khai. Thống kê mới bắt đầu từ lần nâng cấp này; đơn cũ chưa liên kết phiên không được đưa vào tỷ lệ chuyển đổi. Phiên được giữ trong cùng tab cho đến khi đóng tab; không phải số khách hàng duy nhất. Bộ đo không lưu nội dung chat, tên khách, số điện thoại hay địa chỉ." data-en="History retains up to 90 days / 50,000 events; deployment needs persistent storage. New tracking starts with this upgrade; old drafts without session links are excluded from conversion. Sessions last within a tab until it closes; they are not unique customers. Telemetry stores no messages, customer names, phone numbers or addresses."></p><p id="historyDetail" class="detail"></p></details>
<footer data-vi="Website KPI độc lập • Dữ liệu tổng hợp từ OCOP Sales Copilot" data-en="Independent KPI website • Aggregated OCOP Sales Copilot data"></footer>
</main><script>'use strict';
const $=id=>document.getElementById(id),text=(vi,en)=>language==='vi'?vi:en;
let language='vi',lastMetrics=null,controller=null;
try{language=localStorage.getItem('ocop-kpi-language')==='en'?'en':'vi';}catch{}
const colors=['#245941','#b99547','#77a98a','#729bb7','#b97c65','#7b739a'];
const percentage=value=>value==null?'—':(value*100).toFixed(1)+'%';
const number=value=>Number(value||0).toLocaleString(language==='vi'?'vi-VN':'en-GB');
function renderLanguage(){
 document.documentElement.lang=language;document.title=text('OCOP • Bảng KPI','OCOP • KPI Dashboard');
 document.querySelectorAll('[data-vi]').forEach(el=>el.textContent=el.dataset[language]);
 $('lang').textContent=text('Tiếng Việt','English');
 $('lang').title=text('Chuyển sang tiếng Anh','Switch to Vietnamese');
 $('lang').setAttribute('aria-label',text('Ngôn ngữ hiện tại: Tiếng Việt. Chuyển sang tiếng Anh','Current language: English. Switch to Vietnamese'));
 if(lastMetrics)renderMetrics(lastMetrics);
}
function svgElement(tag,attributes={},content){
 const node=document.createElementNS('http://www.w3.org/2000/svg',tag);
 for(const [key,value] of Object.entries(attributes))node.setAttribute(key,value);
 if(content!=null)node.textContent=content;return node;
}
function empty(container){container.replaceChildren();const p=document.createElement('p');p.className='empty';p.textContent=text('Chưa có dữ liệu trong khoảng này','No data in this period');container.append(p);}
function drawHours(data){
 const holder=$('hourChart');holder.replaceChildren();
 if(!data.requests){empty(holder);$('hourSummary').textContent='';return;}
 const rows=data.hourly,maximum=Math.max(1,...rows.map(r=>r.requests)),top=28,bottom=205,left=40,right=565;
 const svg=svgElement('svg',{viewBox:'0 0 590 245',role:'img','aria-label':text('Biểu đồ lượt chat theo giờ','Hourly chat request chart')});
 for(let i=0;i<=4;i++){
  const value=Math.ceil(maximum/4)*i,y=bottom-(value/(Math.ceil(maximum/4)*4))*(bottom-top);
  svg.append(svgElement('line',{x1:left,x2:right,y1:y,y2:y,stroke:'#e4ece3'}),svgElement('text',{x:left-8,y:y+4,'text-anchor':'end',fill:'#758678','font-size':11},value));
 }
 const ceiling=Math.ceil(maximum/4)*4,point=row=>[left+row.hour*(right-left)/23,bottom-row.requests/ceiling*(bottom-top)];
 const points=rows.map(point);
 svg.append(svgElement('path',{d:`M ${left},${bottom} L ${points.map(p=>p.join(',')).join(' L ')} L ${right},${bottom} Z`,fill:'#ebf3e9'}));
 svg.append(svgElement('polyline',{points:points.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#326849','stroke-width':2.5}));
 for(const row of rows){
  const [x,y]=point(row),label=`${String(row.hour).padStart(2,'0')}:00 · ${number(row.requests)} ${text('lượt chat','requests')}`;
  const circle=svgElement('circle',{cx:x,cy:y,r:4,fill:'#326849',tabindex:0,'aria-label':label});circle.append(svgElement('title',{},label));
  const show=()=>{$('hourSummary').textContent=label;};circle.addEventListener('focus',show);circle.addEventListener('pointerenter',show);circle.addEventListener('click',show);svg.append(circle);
  if([0,4,8,12,16,20,23].includes(row.hour))svg.append(svgElement('text',{x,y:230,'text-anchor':'middle',fill:'#758678','font-size':11},`${row.hour}h`));
 }
 holder.append(svg);
 const peak=rows.reduce((a,b)=>b.requests>a.requests?b:a,rows[0]);
 $('hourSummary').textContent=text(`Cao nhất: ${peak.hour}h · ${number(peak.requests)} lượt chat`,`Peak: ${peak.hour}:00 · ${number(peak.requests)} requests`);
}
function drawProducts(data){
 const holder=$('productChart'),legend=$('productLegend');holder.replaceChildren();legend.replaceChildren();
 if(!data.productInterest.length){empty(holder);return;}
 const rows=data.productInterest.slice(0,5).map(p=>({name:language==='en'?p.nameEn:p.name,count:p.count}));
 const other=data.productInterest.slice(5).reduce((sum,p)=>sum+p.count,0);if(other)rows.push({name:text('Sản phẩm khác','Other products'),count:other});
 const total=rows.reduce((sum,p)=>sum+p.count,0),svg=svgElement('svg',{viewBox:'0 0 160 160',role:'img','aria-label':text('Tỷ trọng sản phẩm được tư vấn và tra cứu','Recommended and retrieved product distribution')});let offset=0;
 rows.forEach((row,index)=>{
  const share=row.count/total,label=`${row.name}: ${number(row.count)} (${percentage(share)})`;
  const circle=svgElement('circle',{cx:80,cy:80,r:57,fill:'none',stroke:colors[index],'stroke-width':20,pathLength:100,'stroke-dasharray':`${share*100} ${100-share*100}`,'stroke-dashoffset':-offset,transform:'rotate(-90 80 80)',tabindex:0,'aria-label':label});
  circle.append(svgElement('title',{},label));svg.append(circle);offset+=share*100;
  const li=document.createElement('li'),swatch=document.createElement('span'),name=document.createElement('span'),count=document.createElement('b');
  swatch.className='swatch';swatch.style.backgroundColor=colors[index];name.className='name';name.textContent=row.name;count.textContent=percentage(share);li.title=label;li.append(swatch,name,count);legend.append(li);
 });
 svg.append(svgElement('text',{x:80,y:78,'text-anchor':'middle',fill:'#193b32','font-size':23,'font-weight':700},number(total)),svgElement('text',{x:80,y:96,'text-anchor':'middle',fill:'#758678','font-size':10},text('lượt ghi nhận','observations')));holder.append(svg);
}
function renderMetrics(data){
 $('requests').textContent=number(data.requests);$('sessions').textContent=number(data.trackedSessions);$('drafts').textContent=number(data.draftOrders);
 $('latency').textContent=data.averageResponseMs==null?'—':(data.averageResponseMs/1000).toFixed(2)+' s';
 $('conversion').textContent=percentage(data.conversionRate);$('handoff').textContent=percentage(data.handoffRate);$('automation').textContent=percentage(data.automationRate);$('tools').textContent=percentage(data.toolSuccessRate);
 $('accuracy').textContent=text('Chưa đo','Not measured');$('gemini').textContent=number(data.geminiResponses);$('wiki').textContent=number(data.wikipediaResponses);
 $('paidRevenue').textContent=number(data.paidRevenue)+' ₫';$('chatbotRevenue').textContent=number(data.chatbotPaidRevenue)+' ₫';$('businessOrders').textContent=number(data.confirmedOrders)+' / '+number(data.completedOrders);
 $('paidDetail').textContent=text(`${number(data.paidOrders)} đơn được người bán xác nhận đã thu tiền; gồm phí giao`,`${number(data.paidOrders)} orders with seller-confirmed payment; includes shipping`);
 $('requestDetail').textContent=text(`${number(data.successful)} thành công · ${number(data.failed)} lỗi`,`${number(data.successful)} successful · ${number(data.failed)} errors`);
 $('draftDetail').textContent=text(`${number(data.unlinkedDraftOrders)} đơn chưa gắn với phiên trong khoảng này`,`${number(data.unlinkedDraftOrders)} drafts without a session in this period`);
 $('latencyDetail').textContent=text('Mục tiêu <3 giây · Thời gian backend','Target <3 seconds · Backend time');
 $('conversionDetail').textContent=text(`${number(data.convertedSessions)} / ${number(data.trackedSessions)} phiên có đơn nháp`,`${number(data.convertedSessions)} / ${number(data.trackedSessions)} sessions with drafts`);
 $('handoffDetail').textContent=text(`${number(data.handoffSessions)} / ${number(data.trackedSessions)} phiên cần hỗ trợ`,`${number(data.handoffSessions)} / ${number(data.trackedSessions)} sessions need assistance`);
 $('toolDetail').textContent=text(`${number(data.toolSuccessful)} / ${number(data.toolCalls)} lần gọi · ${number(data.toolFailed)} lỗi`,`${number(data.toolSuccessful)} / ${number(data.toolCalls)} calls · ${number(data.toolFailed)} errors`);
 const locale=language==='vi'?'vi-VN':'en-GB',date=value=>new Date(value).toLocaleString(locale,{timeZone:'Asia/Ho_Chi_Minh'});
 $('status').className='status';$('status').textContent=text(`Dữ liệu: ${date(data.windowStart)} → ${date(data.windowEnd)} (UTC+7)`,`Data: ${date(data.windowStart)} → ${date(data.windowEnd)} (UTC+7)`);
 $('historyDetail').textContent=text(`Bắt đầu ghi nhận: ${date(data.startedAt)}. Tổng đơn nháp trong kho dữ liệu: ${number(data.allTimeDraftOrders)}.`,`Tracking started: ${date(data.startedAt)}. All-time drafts in the order store: ${number(data.allTimeDraftOrders)}.`)+(data.truncated?text(' Đã đạt giới hạn sự kiện: lịch sử cũ có thể không đầy đủ.',' Event cap reached: older history may be incomplete.'):'');
 drawHours(data);drawProducts(data);$('export').disabled=false;
}
async function refresh(){
 controller?.abort();controller=new AbortController();const active=controller;
 $('refresh').disabled=true;
 try{
  const response=await fetch('/api/metrics?period='+encodeURIComponent($('period').value),{cache:'no-store',signal:AbortSignal.any([active.signal,AbortSignal.timeout(7000)])});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();if(active!==controller)return;
  lastMetrics=data;renderMetrics(data);
 }catch(error){if(active!==controller)return;$('status').className='status error';$('status').textContent=text('Mất kết nối backend. Số liệu đang hiển thị chưa được cập nhật.','Backend connection lost. Displayed data has not been updated.');$('export').disabled=true;}
 finally{if(active===controller)$('refresh').disabled=false;}
}
$('lang').onclick=()=>{language=language==='vi'?'en':'vi';try{localStorage.setItem('ocop-kpi-language',language);}catch{}renderLanguage();refresh();};
$('refresh').onclick=refresh;$('period').onchange=refresh;
$('export').onclick=()=>{
 if(!lastMetrics)return;const data=lastMetrics,rows=[['OCOP KPI',data.period],['From',data.windowStart],['To',data.windowEnd],['Metric','Value']];
 for(const key of ['requests','successful','failed','trackedSessions','draftOrders','convertedSessions','conversionRate','averageResponseMs','handoffRate','automationRate','toolCalls','toolSuccessful','toolFailed','toolSuccessRate','geminiResponses','wikipediaResponses','accuracyRate','confirmedOrders','completedOrders','paidOrders','paidRevenue','chatbotPaidRevenue'])rows.push([key,data[key]??'Not measured']);
 rows.push([],['Hour (UTC+7)','Chat requests']);data.hourly.forEach(r=>rows.push([r.hour,r.requests]));rows.push([],['Product ID','Product','Observations']);data.productInterest.forEach(p=>rows.push([p.productId,language==='en'?p.nameEn:p.name,p.count]));
 const csv='\uFEFF'+rows.map(row=>row.map(value=>{let s=String(value);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`ocop-kpi-${data.period}-${data.windowEnd.slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
window.addEventListener('storage',event=>{if(event.key==='ocop-kpi-language'){language=event.newValue==='en'?'en':'vi';renderLanguage();}});
renderLanguage();refresh();setInterval(()=>{if(!document.hidden)refresh();},10000);
</script></body></html>
