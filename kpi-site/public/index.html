<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OCOP • Dashboard KPI</title><link rel="stylesheet" href="dashboard.css"></head>
<body><main>
<header><div class="brand"><span class="logo" aria-hidden="true">O</span><div><strong>OCOP KPI</strong><small data-vi="Hiệu quả từ dữ liệu thực" data-en="Performance from real data"></small></div></div><div class="actions"><span class="live" data-vi="Cập nhật mỗi 10 giây" data-en="Updates every 10 seconds"></span><button id="lang" type="button" title="Chuyển sang tiếng Anh">Tiếng Việt</button><button id="refresh" data-vi="Làm mới" data-en="Refresh"></button></div></header>
<p class="eyebrow">OCOP SALES COPILOT / AI DIGITAL BUSINESS CHALLENGE 2026</p>
<h1 data-vi="Bảng điều khiển hiệu suất" data-en="Performance dashboard"></h1>
<p class="intro" data-vi="Theo dõi chất lượng tư vấn, hoạt động AI và hiệu quả tạo đơn nháp trong cùng một góc nhìn." data-en="Track consultation quality, AI operations and draft order performance in one view."></p>
<div class="toolbar"><label for="period" data-vi="Khoảng thời gian" data-en="Time range"></label><select id="period"><option value="day" data-vi="Hôm nay" data-en="Today"></option><option value="week" data-vi="7 ngày gần nhất" data-en="Last 7 days"></option><option value="month" data-vi="30 ngày gần nhất" data-en="Last 30 days"></option><option value="all" data-vi="Lịch sử lưu giữ (tối đa 90 ngày)" data-en="Retained history (up to 90 days)"></option></select><button id="export" disabled data-vi="Xuất CSV" data-en="Export CSV"></button></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section class="grid" aria-label="KPIs">
<article class="card"><span data-vi="Tin nhắn đã xử lý" data-en="Processed messages"></span><div class="value" id="requests">—</div><small id="requestDetail"></small></article>
<article class="card"><span data-vi="Phiên tư vấn" data-en="Consultation sessions"></span><div class="value" id="sessions">—</div><small data-vi="Phiên ẩn danh có ít nhất một lượt chat" data-en="Anonymous sessions with at least one chat"></small></article>
<article class="card"><span data-vi="Đơn nháp đã tạo" data-en="Created draft orders"></span><div class="value" id="drafts">—</div><small id="draftDetail"></small></article>
<article class="card"><span data-vi="Phản hồi trung bình" data-en="Average response time"></span><div class="value" id="latency">—</div><small id="latencyDetail"></small></article>
<article class="card"><span data-vi="Chuyển đổi đơn nháp" data-en="Draft conversion"></span><div class="value" id="conversion">—</div><small id="conversionDetail"></small></article>
<article class="card"><span data-vi="Phiên yêu cầu nhân viên" data-en="Sessions requesting staff"></span><div class="value" id="handoff">—</div><small id="handoffDetail"></small></article>
<article class="card"><span data-vi="Tự phục vụ (ước tính)" data-en="Self-service (estimate)"></span><div class="value" id="automation">—</div><small data-vi="Phiên không lỗi và không yêu cầu nhân viên / tổng phiên" data-en="Sessions without errors or staff requests / all sessions"></small></article>
<article class="card"><span data-vi="Gọi công cụ thành công" data-en="Successful tool calls"></span><div class="value" id="tools">—</div><small id="toolDetail"></small></article>
</section>
<section class="panel technical"><h2 data-vi="Kết quả kinh doanh đã xác nhận" data-en="Confirmed business outcomes"></h2><p class="detail" data-vi="Theo thời điểm người bán ghi nhận từng trạng thái trong khoảng đã chọn. Thanh toán là xác nhận của người bán, chưa tích hợp đối soát ngân hàng tự động." data-en="Based on when the seller records each status within the selected period. Payment is seller-confirmed; automatic bank reconciliation is not connected."></p><div class="quality"><div><span data-vi="Doanh thu đã thu" data-en="Received revenue"></span><strong id="paidRevenue">—</strong><small id="paidDetail"></small></div><div><span data-vi="Doanh thu gắn phiên chatbot" data-en="Chatbot-linked revenue"></span><strong id="chatbotRevenue">—</strong><small data-vi="Đơn có mã phiên tư vấn và được xác nhận đã thu tiền; gồm phí giao hàng" data-en="Paid orders linked to a consultation session; includes shipping"></small></div><div><span data-vi="Đơn xác nhận / hoàn tất" data-en="Confirmed / completed orders"></span><strong id="businessOrders">—</strong><small data-vi="Hoàn tất giao hàng chưa đồng nghĩa đã thu tiền" data-en="Completed delivery does not imply payment received"></small></div></div></section>
<section class="charts">
<article class="panel"><div class="panel-title"><h2 data-vi="Nhịp tư vấn theo giờ" data-en="Consultations by hour"></h2><span class="badge">UTC+7</span></div><p class="detail" data-vi="Số lượt chat theo 24 khung giờ, cộng gộp các ngày trong khoảng đã chọn. Chạm hoặc rê chuột vào điểm để xem số lượt." data-en="Chat requests across 24 hourly slots, summed over the selected days. Tap or hover over a point for the count."></p><div id="hourChart" class="chart"></div><p id="hourSummary" class="detail"></p></article>
<article class="panel"><h2 data-vi="Sản phẩm được tư vấn / tra cứu" data-en="Recommended / retrieved products"></h2><p class="detail" data-vi="Đếm mỗi sản phẩm một lần trong mỗi câu trả lời hoặc kết quả công cụ thành công; không phải doanh số hay nhu cầu được khách xác nhận." data-en="Each product counts once per successful answer or tool result; this is not sales or confirmed customer demand."></p><div class="donut-layout"><div id="productChart" class="donut"></div><ul id="productLegend" class="legend"></ul></div></article>
</section>
<section class="panel technical"><div><h2 data-vi="Chất lượng AI & nguồn dữ liệu" data-en="AI quality & data sources"></h2><p class="detail" data-vi="Phân biệt chỉ số đã đo với mục tiêu cần kiểm chứng." data-en="Separate measured outcomes from targets that need validation."></p></div><div class="quality"><div><span data-vi="Độ chính xác RAG" data-en="RAG accuracy"></span><strong id="accuracy">—</strong><small data-vi="Mục tiêu >95%. Chưa có bộ kiểm thử được gán nhãn đối chiếu hồ sơ gốc; chưa thể công bố tỷ lệ." data-en="Target >95%. No labelled evaluation against source records exists yet; accuracy cannot be reported."></small></div><div><span data-vi="Phản hồi có Gemini" data-en="Responses with Gemini"></span><strong id="gemini">—</strong><small data-vi="Đếm phản hồi có ghi nhận tích hợp Gemini" data-en="Responses reporting Gemini participation"></small></div><div><span data-vi="Phản hồi có Wikipedia" data-en="Responses with Wikipedia"></span><strong id="wiki">—</strong><small data-vi="Ngữ cảnh văn hóa tham khảo, không xác nhận thông tin riêng của sản phẩm" data-en="Cultural context; does not verify product-specific claims"></small></div></div></section>
<details class="panel definitions"><summary data-vi="Cách đo và giới hạn số liệu" data-en="Measurement definitions and limits"></summary><p data-vi="Chuyển đổi = số phiên tư vấn có ít nhất một đơn nháp mới trong khoảng đã chọn / tổng phiên tư vấn cùng khoảng. Đơn nháp chưa phải đơn đã thanh toán. Gửi lại cùng một đơn không tăng bộ đếm." data-en="Conversion = consultation sessions with at least one new draft in the selected period / consultation sessions in that period. Drafts are not paid orders. Retrying the same draft does not increase the count."></p><p data-vi="Yêu cầu nhân viên thể hiện bot gắn cờ cần hỗ trợ; chưa xác nhận nhân viên đã tiếp nhận. Tự phục vụ là chỉ số ước tính, không chứng minh vấn đề đã được giải quyết hay bán hàng thành công." data-en="Staff requests indicate that the bot flags a need for assistance, not confirmed staff receipt. Self-service is a proxy, not proof of issue resolution or successful sales."></p><p data-vi="Thời gian đo từ lúc backend nhận yêu cầu đến lúc trả JSON, gồm cả yêu cầu lỗi; không gồm mạng và hiển thị trình duyệt. Công cụ thành công nghĩa là không trả lỗi thực thi, không đánh giá độ đúng nội dung hay xác nhận còn hàng." data-en="Latency measures backend time to JSON, including failures; excludes network and browser rendering. Tool success means execution without an error, not content accuracy or confirmed stock availability."></p><p data-vi="Lịch sử được lưu tối đa 90 ngày / 50.000 sự kiện, cần ổ đĩa lưu trữ bền vững khi triển khai. Thống kê mới bắt đầu từ lần nâng cấp này; đơn cũ chưa liên kết phiên không được đưa vào tỷ lệ chuyển đổi. Phiên được giữ trong cùng tab cho đến khi đóng tab; không phải số khách hàng duy nhất. Bộ đo không lưu nội dung chat, tên khách, số điện thoại hay địa chỉ." data-en="History retains up to 90 days / 50,000 events; deployment needs persistent storage. New tracking starts with this upgrade; old drafts without session links are excluded from conversion. Sessions last within a tab until it closes; they are not unique customers. Telemetry stores no messages, customer names, phone numbers or addresses."></p><p id="historyDetail" class="detail"></p></details>
<footer data-vi="Website KPI độc lập • Dữ liệu tổng hợp từ OCOP Sales Copilot" data-en="Independent KPI website • Aggregated OCOP Sales Copilot data"></footer>
</main><script src="dashboard.js?v=20261010_language"></script></body></html>
