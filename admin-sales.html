<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="ocop-api-base" content=""><title>OCOP • Quản trị người bán</title><link rel="stylesheet" href="/sales-pages.css"><link rel="stylesheet" href="/admin-sales.css"></head><body><main>
<header><a href="/index.html" data-vi="← Cửa hàng" data-en="← Shop"></a><button id="lang">English</button></header><p class="detail">OCOP SELLER WORKSPACE</p><h1 data-vi="Điều hành cửa hàng" data-en="Manage your shop"></h1>
<form id="login"><label><span data-vi="Mật khẩu quản trị hiện có" data-en="Existing administrator password"></span><input name="password" type="password" autocomplete="current-password" required></label><button class="primary" data-vi="Đăng nhập" data-en="Sign in"></button></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><div class="bar"><button id="reload" data-vi="Làm mới dữ liệu" data-en="Refresh data"></button><button id="logout" data-vi="Đăng xuất" data-en="Sign out"></button></div>
<div class="overview"><article class="card"><span data-vi="Đơn chờ xác nhận" data-en="Pending drafts"></span><strong id="pendingCount">—</strong></article><article class="card"><span data-vi="Đơn đang xử lý" data-en="Active orders"></span><strong id="activeCount">—</strong></article><article class="card"><span data-vi="Hội thoại cần hỗ trợ" data-en="Pending support"></span><strong id="supportCount">—</strong></article></div>
<nav class="tabs" aria-label="Workspace"><button data-tab="products" data-vi="Giá & tồn kho" data-en="Prices & inventory"></button><button data-tab="orders" data-vi="Đơn hàng" data-en="Orders"></button><button data-tab="chats" data-vi="Hội thoại" data-en="Conversations"></button></nav>
<section id="productsPanel"><h2 data-vi="Quản lý giá và kho" data-en="Manage prices and stock"></h2><p class="detail" data-vi="Giá cập nhật áp dụng cho tư vấn AI và đơn mới. Đơn đã tạo giữ giá tại thời điểm khách xác nhận. Tồn kho là số lượng còn có thể bán, chưa dành cho đơn đã xác nhận." data-en="Price updates apply to AI advice and new orders. Existing drafts retain the agreed price. Stock is the quantity still available for sale, excluding confirmed reservations."></p><form id="inventory"><label><span data-vi="Tìm sản phẩm" data-en="Find a product"></span><input id="productSearch" type="search"></label><label><span data-vi="Sản phẩm" data-en="Product"></span><select id="product" required></select></label><p class="detail" id="productFacts"></p><div class="fields"><label><span data-vi="Giá bán (đồng)" data-en="Price (VND)"></span><input id="price" type="number" min="1" max="100000000" step="1" required></label><label><span data-vi="Tồn kho đã kiểm kê (bỏ trống nếu chưa biết)" data-en="Verified stock (leave blank if unknown)"></span><input id="stock" type="number" min="0" max="1000000" step="1"></label></div><button class="primary" data-vi="Lưu giá & tồn kho" data-en="Save price & inventory"></button></form></section>
<section id="ordersPanel" hidden><div class="bar"><h2 data-vi="Đơn nháp & xử lý đơn" data-en="Drafts & order processing"></h2><select id="orderFilter" aria-label="Order status"><option value="all" data-vi="Tất cả trạng thái" data-en="All statuses"></option><option value="pending_seller_confirmation" data-vi="Chờ xác nhận" data-en="Pending confirmation"></option><option value="confirmed" data-vi="Đã xác nhận" data-en="Confirmed"></option><option value="shipped" data-vi="Đã gửi hàng" data-en="Shipped"></option><option value="completed" data-vi="Hoàn tất" data-en="Completed"></option><option value="cancelled" data-vi="Đã hủy" data-en="Cancelled"></option></select></div><p class="detail" data-vi="Xác nhận sẽ kiểm tra lại giá, giữ hàng bằng cách trừ số lượng có thể bán. Trạng thái giao hàng và thanh toán được cập nhật riêng bởi người bán." data-en="Confirmation rechecks prices and reserves stock by reducing available quantities. The seller updates shipping and payment independently."></p><div id="drafts"></div></section>
<section id="chatsPanel" hidden><div class="bar"><h2 data-vi="Hội thoại tư vấn" data-en="Consultation conversations"></h2><select id="chatFilter" aria-label="Support filter"><option value="pending" data-vi="Cần nhân viên hỗ trợ" data-en="Needs staff support"></option><option value="all" data-vi="Tất cả hội thoại" data-en="All conversations"></option><option value="resolved" data-vi="Đã xử lý hỗ trợ" data-en="Support resolved"></option></select></div><p class="detail" data-vi="Chỉ người bán đã đăng nhập được xem. Lưu tối đa 500 phiên / 90 ngày, 60 tin nhắn gần nhất mỗi phiên. Hội thoại mới được ghi nhận từ lần nâng cấp này." data-en="Visible only to authenticated sellers. Retains up to 500 sessions / 90 days and 60 recent messages per session. Logging starts with this upgrade."></p><div id="conversations"></div></section>
</section></main><script src="/sales-pages.js"></script><script src="/admin-sales.js"></script></body></html>
